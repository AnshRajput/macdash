name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile macdash.py
      - run: sh -n install.sh uninstall.sh
      - run: python3 -m unittest -v test_macdash
      - name: Smoke test
        run: |
          MACDASH_PORT=7799 python3 macdash.py &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do
            [ "$(curl -s -o /tmp/stats.json -w '%{http_code}' http://127.0.0.1:7799/api/stats)" = 200 ] && break
            sleep 2
          done
          python3 -c "import json; json.load(open('/tmp/stats.json'))"
